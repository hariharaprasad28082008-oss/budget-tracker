<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Budget Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

</head>


<body class="auth-page">


<div class="auth-card">


    <div class="text-center">

        <div class="logo-icon">
            💰
        </div>

        <h2>
            Budget Tracker
        </h2>

        <p class="text-muted">
            Create your account
        </p>

    </div>


    <h4 class="text-center mb-4">
        Sign Up
    </h4>


    <form id="signupForm">


        <div class="mb-3">

            <label class="form-label">
                Name
            </label>

            <input
                type="text"
                id="name"
                class="form-control"
                placeholder="Enter your name"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Minimum 6 characters"
                minlength="6"
                required>

        </div>


        <div id="signupMessage"></div>


        <button
            type="submit"
            class="btn btn-success w-100 mt-2">

            Create Account

        </button>


    </form>


    <p class="text-center mt-4">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </p>


</div>


<script>

const signupForm =
    document.getElementById(
        "signupForm"
    );


signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const message =
            document.getElementById(
                "signupMessage"
            );


        try {

            const response =
                await fetch(
                    "/api/signup",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name,
                                email,
                                password
                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.innerHTML = `

                    <div class="alert alert-danger">
                        ${data.error}
                    </div>

                `;

                return;

            }


            message.innerHTML = `

                <div class="alert alert-success">
                    Account created successfully!
                    Redirecting to login...
                </div>

            `;


            signupForm.reset();


            setTimeout(() => {

                window.location.href =
                    "/login";

            }, 1500);


        } catch (error) {

            console.error(error);


            message.innerHTML = `

                <div class="alert alert-danger">
                    Server connection failed.
                </div>

            `;

        }

    }
);

</script>


</body>
</html>
