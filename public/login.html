<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Budget Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

</head>


<body class="auth-page">


<div class="auth-card">

    <div class="text-center">

        <div class="logo-icon">
            💰
        </div>

        <h2>
            Budget Tracker
        </h2>

        <p class="text-muted">
            Manage your money easily
        </p>

    </div>


    <h4 class="text-center mb-4">
        Login
    </h4>


    <form id="loginForm">


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required>

        </div>


        <div id="loginMessage"></div>


        <button
            type="submit"
            class="btn btn-primary w-100 mt-2">

            Login

        </button>


    </form>


    <p class="text-center mt-4">

        Don't have an account?

        <a href="/signup">
            Sign Up
        </a>

    </p>


</div>


<script>

const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const message =
            document.getElementById(
                "loginMessage"
            );


        try {

            const response =
                await fetch(
                    "/api/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                email,
                                password
                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.innerHTML = `

                    <div class="alert alert-danger">
                        ${data.error}
                    </div>

                `;

                return;

            }


            message.innerHTML = `

                <div class="alert alert-success">
                    Login successful!
                </div>

            `;


            setTimeout(() => {

                window.location.href = "/";

            }, 500);


        } catch (error) {

            console.error(error);


            message.innerHTML = `

                <div class="alert alert-danger">
                    Server connection failed.
                </div>

            `;

        }

    }
);

</script>


</body>
</html>
