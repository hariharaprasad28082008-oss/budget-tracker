<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Budget Tracker</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="/style.css">

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            💰 Budget Tracker
        </a>

        <div class="d-flex align-items-center gap-3">

            <span
                id="welcomeUser"
                class="text-white">
            </span>

            <button
                class="btn btn-outline-light"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>

</nav>



<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container mt-4">

    <h2 class="mb-4">
        Dashboard
    </h2>



    <!-- =========================
         SUMMARY CARDS
    ========================= -->

    <div class="row g-3 mb-4">


        <!-- INCOME -->

        <div class="col-md-4">

            <div class="card summary-card">

                <div class="card-body">

                    <h5>
                        Total Income
                    </h5>

                    <h2
                        id="totalIncome"
                        class="text-success">

                        ₹0.00

                    </h2>

                </div>

            </div>

        </div>



        <!-- EXPENSE -->

        <div class="col-md-4">

            <div class="card summary-card">

                <div class="card-body">

                    <h5>
                        Total Expense
                    </h5>

                    <h2
                        id="totalExpense"
                        class="text-danger">

                        ₹0.00

                    </h2>

                </div>

            </div>

        </div>



        <!-- BALANCE -->

        <div class="col-md-4">

            <div class="card summary-card">

                <div class="card-body">

                    <h5>
                        Balance
                    </h5>

                    <h2 id="balance">

                        ₹0.00

                    </h2>

                </div>

            </div>

        </div>


    </div>



    <!-- =========================
         ADD TRANSACTION
    ========================= -->

    <div class="card mb-4">


        <div class="card-header">

            <h4 class="mb-0">
                Add Transaction
            </h4>

        </div>


        <div class="card-body">


            <form id="transactionForm">


                <div class="row g-3">


                    <!-- TYPE -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Type
                        </label>

                        <select
                            id="type"
                            class="form-select"
                            required>

                            <option value="">
                                Select Type
                            </option>

                            <option value="income">
                                Income
                            </option>

                            <option value="expense">
                                Expense
                            </option>

                        </select>

                    </div>



                    <!-- CATEGORY -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            id="category"
                            class="form-select"
                            required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Salary">
                                Salary
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- AMOUNT -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            class="form-control"
                            placeholder="Enter amount"
                            min="1"
                            step="0.01"
                            required>

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            class="form-control"
                            placeholder="Enter description">

                    </div>



                    <!-- DATE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            id="transaction_date"
                            class="form-control"
                            required>

                    </div>



                    <!-- BUTTON -->

                    <div class="col-12">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Add Transaction

                        </button>

                    </div>


                </div>


            </form>


        </div>

    </div>



    <!-- =========================
         PIE CHART
    ========================= -->

    <div class="card mb-4">


        <div class="card-header">

            <h4 class="mb-0">
                Expense Breakdown
            </h4>

            <small class="text-muted">
                Where your money is being spent
            </small>

        </div>


        <div class="card-body">


            <!-- MESSAGE -->

            <div
                id="chartMessage"
                class="text-center text-muted py-3"
                style="display: none;">

            </div>



            <!-- CHART -->

            <div
                class="chart-container">

                <canvas
                    id="expenseChart">
                </canvas>

            </div>


        </div>

    </div>



    <!-- =========================
         TRANSACTIONS
    ========================= -->

    <div class="card mb-5">


        <div class="card-header">

            <h4 class="mb-0">
                Transactions
            </h4>

        </div>


        <div class="card-body">


            <div class="table-responsive">


                <table
                    class="table table-hover align-middle">


                    <thead>

                        <tr>

                            <th>
                                Type
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="transactionTable">

                    </tbody>


                </table>


            </div>


        </div>

    </div>


</div>



<!-- =========================
     CHART.JS
========================= -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js">
</script>



<!-- =========================
     YOUR JAVASCRIPT
========================= -->

<script
    src="/script.js">
</script>


</body>

</html>
