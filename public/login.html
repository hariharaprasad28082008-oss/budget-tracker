<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Budget Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .auth-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); width: 100%; max-width: 400px; }
        .form-control { border-radius: 6px; padding: 0.6rem 0.75rem; border: 1px solid #dee2e6; }
        .form-control:focus { box-shadow: none; border-color: #0d6efd; }
        .btn-auth { background-color: #0d6efd; border: none; padding: 0.6rem; border-radius: 6px; font-weight: 500; color: white; }
        .btn-auth:hover { background-color: #0b5ed7; color: white; }
    </style>
</head>
<body>

<div class="auth-card text-center">
    <div class="mb-2">
        <span style="font-size: 2.5rem;">💰</span>
    </div>
    <h3 class="fw-bold mb-1">Budget Tracker</h3>
    <p class="text-muted mb-4" style="font-size: 0.95rem;">Manage your money easily</p>
    
    <h4 class="fw-bold mb-3" style="font-size: 1.35rem;">Login</h4>
    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label text-secondary" style="font-size: 0.9rem; font-weight: 500;">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label text-secondary" style="font-size: 0.9rem; font-weight: 500;">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-auth w-100 mb-3">Login</button>
    </form>
    
    <p class="mb-0 text-muted" style="font-size: 0.9rem;">Don't have an account? <a href="/signup.html" class="text-decoration-none fw-bold" style="color: #0d6efd;">Sign Up</a></p>
</div>

<script src="/login.js"></script>
</body>
</html>
