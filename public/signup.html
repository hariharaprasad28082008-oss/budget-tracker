<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top, #1e293b, #0f172a); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui; }
        .auth-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); padding: 2.5rem; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .form-control { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff !important; border-radius: 8px; padding: 0.7rem; }
        .form-control::placeholder { color: #64748b; }
        .form-control:focus { background: rgba(255,255,255,0.08); border-color: #34d399; box-shadow: 0 0 15px rgba(52, 211, 153, 0.2); }
        .btn-auth { background: linear-gradient(135deg, #34d399, #059669); border: none; padding: 0.7rem; border-radius: 8px; font-weight: 600; color: #fff; box-shadow: 0 4px 15px rgba(52,211,153,0.2); transition: 0.2s; }
        .btn-auth:hover { transform: translateY(-1px); opacity: 0.95; }
    </style>
</head>
<body>
<div class="auth-card text-center">
    <div class="mb-2" style="font-size: 2.8rem; filter: drop-shadow(0 0 10px rgba(52,211,153,0.3));">💰</div><h3 class="fw-bold text-white mb-1">Budget Tracker</h3><p class="text-muted mb-4" style="font-size: 0.9rem;">Join us to track your growth</p>
    <h5 class="fw-bold text-white-50 text-start mb-3">Get Started</h5>
    <form id="signupForm">
        <div class="mb-3 text-start"><label class="text-white-50 small mb-1">Name</label><input type="text" id="name" class="form-control" placeholder="Your name" required></div>
        <div class="mb-3 text-start"><label class="text-white-50 small mb-1">Email</label><input type="email" id="email" class="form-control" placeholder="name@example.com" required></div>
        <div class="mb-4 text-start"><label class="text-white-50 small mb-1">Password</label><input type="password" id="password" class="form-control" placeholder="••••••••" required></div>
        <button type="submit" class="btn btn-auth w-100 mb-3">Register</button>
    </form>
    <p class="mb-0 text-muted small">Have an account? <a href="/login.html" class="text-decoration-none fw-bold" style="color: #34d399;">Sign In</a></p>
</div>
<script src="/signup.js"></script>
</body>
</html>
