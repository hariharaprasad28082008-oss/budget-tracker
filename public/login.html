<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Budget Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="auth-card text-center">
    <h2 class="mb-2">💰</h2>
    <h3 class="fw-bold mb-1">Budget Tracker</h3>
    <p class="text-muted mb-4">Manage your money easily</p>
    
    <h4 class="text-start mb-3">Login</h4>
    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
    </form>
    
    <!-- FIX: Path references signup.html directly to clear single page router exceptions -->
    <p class="mb-0 text-muted">Don't have an account? <a href="/signup.html" class="text-decoration-none fw-bold">Sign Up</a></p>
</div>

<script src="/login.js"></script>
</body>
</html>

</html>
